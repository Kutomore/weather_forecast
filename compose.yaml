services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: bin/docker-dev-entrypoint
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/bundle

volumes:
  bundle:
